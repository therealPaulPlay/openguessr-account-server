name: Deploy Account Backend Node Server

on:
  push:
    branches:
      - main

jobs:
  deploy-primary:
    runs-on: ubuntu-22.04

    steps:
      - name: Install SSH keys for Primary Server
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts

      - name: Connect to Primary Server, build image, and deploy
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ${{ secrets.WORK_DIR }}

            # Write .env file from secret
            echo "${{ secrets.ENV_FILE }}" > .env

            # Pull latest changes from Git
            git checkout ${{ secrets.MAIN_BRANCH }}
            git pull

            # Build Docker image
            docker build -t openguessraccountserver .

            # Check if container openguessraccountserver exists
            if ! docker ps -a --format '{{.Names}}' | grep -q "^openguessraccountserver$"; then
              echo "Container openguessraccountserver does not exist, creating..."
              docker run -d -p 3005:3005 --network host --restart unless-stopped --name openguessraccountserver openguessraccountserver
            else
              echo "Container openguessraccountserver exists, stopping and removing..."
              docker stop openguessraccountserver || true
              docker rm openguessraccountserver || true
              docker run -d -p 3005:3005 --network host --restart unless-stopped --name openguessraccountserver openguessraccountserver
            fi
          EOF

      - name: Cleanup SSH for Primary Server
        run: rm -rf ~/.ssh

  deploy-backup:
    runs-on: ubuntu-22.04
    needs: deploy-primary

    steps:
      - name: Install SSH keys for Backup Server
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.BACKUP_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.BACKUP_SSH_HOST }} > ~/.ssh/known_hosts

      - name: Connect to Backup Server, build image, and deploy
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.BACKUP_SSH_HOST }} << 'EOF'
            cd ${{ secrets.WORK_DIR }}

            # Write .env file from secret
            echo "${{ secrets.ENV_FILE }}" > .env

            # Pull latest changes from Git
            git checkout ${{ secrets.MAIN_BRANCH }}
            git pull

            # Build Docker image
            docker build -t openguessraccountserver .

            # Check if container openguessraccountserver exists
            if ! docker ps -a --format '{{.Names}}' | grep -q "^openguessraccountserver$"; then
              echo "Container openguessraccountserver does not exist, creating..."
              docker run -d -p 3005:3005 --network host --restart unless-stopped --name openguessraccountserver openguessraccountserver
            else
              echo "Container openguessraccountserver exists, stopping and removing..."
              docker stop openguessraccountserver || true
              docker rm openguessraccountserver || true
              docker run -d -p 3005:3005 --network host --restart unless-stopped --name openguessraccountserver openguessraccountserver
            fi
          EOF

      - name: Cleanup SSH for Backup Server
        run: rm -rf ~/.ssh